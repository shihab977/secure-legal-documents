version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: zero_knowledge_mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=secure_legal_db
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: zero_knowledge_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

volumes:
  mongo_data:
  minio_data:
